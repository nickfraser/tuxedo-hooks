name: Release Tuxedo Hooks

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release; it must match the version in Cargo.toml"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build glibc 2.17-compatible binary
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: |
          docker run --rm \
            --env RELEASE_TAG \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -lc '
              set -euxo pipefail
              curl -fsSL https://micro.mamba.pm/api/micromamba/linux-64/latest \
                | tar -xj -C /usr/local/bin --strip-components=1 bin/micromamba
              export MAMBA_ROOT_PREFIX=/opt/micromamba
              micromamba create -y --prefix /opt/tuxedo-hooks-rust -c conda-forge rust=1.98.0
              export PATH=/opt/tuxedo-hooks-rust/bin:$PATH
              cargo build --release --locked --target "'$TARGET'"
              case "$RELEASE_TAG" in
                v*) ;;
                *) echo "Release tag must start with v: $RELEASE_TAG" >&2; exit 1 ;;
              esac
              actual_version="$(target/'$TARGET'/release/tuxedo-hooks --version)"
              test "$actual_version" = "tuxedo-hooks ${RELEASE_TAG#v}"
              max_glibc=$(readelf --version-info target/'$TARGET'/release/tuxedo-hooks \
                | grep -o "GLIBC_[0-9.]*" | sort -V | tail -n1)
              test "$(printf "%s\\n%s\\n" "$max_glibc" GLIBC_2.17 | sort -V | tail -n1)" = GLIBC_2.17
            '

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_TAG"
          target="x86_64-unknown-linux-gnu"
          stage="tuxedo-hooks-${version}-${target}"
          mkdir -p "dist/${stage}"
          install -m 755 "target/${target}/release/tuxedo-hooks" "dist/${stage}/tuxedo-hooks"
          cp README.md LICENSE "dist/${stage}/"
          (
            cd dist
            tar -czf "${stage}.tar.gz" "${stage}"
            sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256"
          )

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tuxedo-hooks-x86_64-unknown-linux-gnu
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
