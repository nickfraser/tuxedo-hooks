[package]
name = "tuxedo-hooks"
version = "2026.9.1"
edition = "2024"
description = "Keyboard-driven terminal UI and CLI for todo.txt with post-mutation hooks"
license = "MIT"
repository = "https://github.com/nickfraser/tuxedo-hooks"
homepage = "https://github.com/nickfraser/tuxedo-hooks"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0"
chrono = "0.4.44"
crossterm = "0.29.0"
getrandom = "0.2"
notify = "8"
qrcode = { version = "0.14", default-features = false }
ratatui = "0.30.0"
tiny_http = "0.12"

[dev-dependencies]
insta = "1.47"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
